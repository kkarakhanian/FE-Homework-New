<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My first page</title>
    <script src="./js/script.js"></script>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="container">
    <h1>TODO LIST</h1>

    <form id="todo-form">
        <div class="form-group">
            <label for="title">Task title</label>
            <input type="text" id="title" placeholder="Title" />
        </div>

        <div class="form-group">
            <label for="body">Task body</label>
            <textarea id="body" placeholder="Task body"></textarea>
        </div>

        <div class="buttons">
            <button type="submit" class="btn blue">Create Task!</button>
            <button type="button" id="clear-form" class="btn yellow">Очистить</button>
            <button type="button" id="delete-all" class="btn red">Удалить все</button>
        </div>
    </form>

    <ul id="task-list"></ul>
</div>
</body>
</html>
