<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item edit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: "Inter", sans-serif;
            background-color: #f8f9fa;
            padding-top: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }
        .form-label {
            font-weight: bold;
        }
        .btn-save {
            border-radius: 8px;
            padding: 10px 20px;
        }
        .alert-container {
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="mb-4 text-center">Item edit</h1>
    <form id="editProductForm">
        <div class="mb-3">
            <label for="productId" class="form-label">ID Товару</label>
            <input type="text" class="form-control rounded-3" id="productId" readonly>
        </div>
        <div class="mb-3">
            <label for="productName" class="form-label">Item name</label>
            <input type="text" class="form-control rounded-3" id="productName" required>
        </div>
        <div class="mb-3">
            <label for="productDescription" class="form-label">Description</label>
            <textarea class="form-control rounded-3" id="productDescription" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label for="productPrice" class="form-label">Cost</label>
            <input type="number" step="0.01" class="form-control rounded-3" id="productPrice" required>
        </div>
        <div class="alert-container" id="alertContainer"></div>
        <button type="submit" class="btn btn-success w-100 btn-save">Save cheanges</button>
        <a href="index.html" class="btn btn-secondary w-100 btn-save mt-2">Cancel and back</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/edit.js"></script>
</body>
</html>
